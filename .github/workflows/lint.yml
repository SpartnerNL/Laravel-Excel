name: 'Lint'

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - 4.x

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: '${{ matrix.command.name }}'
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        command:
          - { name: 'Pint',   command: 'vendor/bin/pint --test --parallel --ansi' }
          - { name: 'Rector', command: 'vendor/bin/rector process --dry-run --no-progress-bar --output-format=github --ansi' }

    steps:
      - name: 'Checkout'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          coverage: none

      - name: 'Cache dependencies'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-lint-${{ hashFiles('composer.json') }}
          restore-keys: composer-lint-

      - name: 'Install dependencies'
        run: composer install --no-interaction --prefer-dist --ansi
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache

      - name: '${{ matrix.command.name }}'
        run: $LINT_COMMAND
        env:
          LINT_COMMAND: ${{ matrix.command.command }}

  phpstan:
    name: 'PHPStan (PHP${{ matrix.php }} - L${{ matrix.laravel }})'
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
        laravel: [ 12, 13 ]
        exclude:
          - laravel: 13
            php: 8.3

    steps:
      - name: 'Checkout'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: 'Cache dependencies'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-phpstan-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-phpstan-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-phpstan-${{ matrix.php }}-

      - name: 'Install dependencies'
        run: |
          composer require "laravel/framework:${LARAVEL_VERSION}.*" -n --no-update --ansi
          composer update --prefer-stable --ansi
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache
          LARAVEL_VERSION: ${{ matrix.laravel }}

      - name: 'PHPStan'
        run: vendor/bin/phpstan --no-progress --ansi
